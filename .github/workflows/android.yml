name: Zbuduj APK (Android)
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalacja
        run: npm install
      - name: Projekt Androida
        run: npx cap add android
      - name: Blokada pionu
        run: sed -i '0,/<activity/s//<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
      - name: Ikona (opcjonalna)
        if: ${{ hashFiles('app/assets/ikona-nowa-1024.png') != '' }}
        run: cp assets/ikona-nowa-1024.png assets/icon-only.png && node make-fg.js && npx @capacitor/assets generate --android --iconBackgroundColor '#160527' --iconBackgroundColorDark '#160527'
      - name: Synchronizacja
        run: npx cap sync android
      - name: Budowa APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dragon-outcast-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
